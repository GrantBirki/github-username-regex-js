name: lint
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

cache-mode: none

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: install dependencies
        run: npm ci

      - name: lint
        run: |
          npm run format-check
          npm run lint
