name: build
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

cache-mode: none

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: install dependencies
        run: npm ci

      - name: build
        run: npm run build
